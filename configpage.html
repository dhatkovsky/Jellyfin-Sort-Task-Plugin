<div id="SortTitleUpdaterConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="loading,elements,formhelper,toast">
    <div data-role="content">
        <div class="content-primary">
            <form id="SortTitleUpdaterForm" class="padded-left padded-right">

                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">SortTitleUpdater</h2>
                </div>

                <div class="readOnlyContent">
                    <p class="textMuted">Select target libraries and media types that the scheduled task will automatically process.</p>
                </div>

                <!-- Section 1: Libraries -->
                <div class="verticalSection">
                    <h3 class="sectionTitle">Target Libraries</h3>
                    <div id="LibraryList" class="paperList padded-left padded-right"></div>
                </div>

                <br />

                <!-- Section 2: Media Kinds -->
                <div class="verticalSection">
                    <h3 class="sectionTitle">Target Media Types</h3>
                    <div id="MediaKindsList" class="paperList padded-left padded-right"></div>
                </div>

                <br />
                <div class="flex align-items-center justify-content-start">
                    <button type="submit" is="emby-button" class="raised button-submit block emby-button">
                        <span>Save Settings</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
                var SortTitleUpdaterPage = {
                    pluginId: 'a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d',
                    // FIXED: Added Season and Episode options to the web interface array
                    availableKinds: ["Movie", "Series", "Season", "Episode", "MusicArtist", "MusicAlbum", "Audio", "Book", "AudioBook", "Video", "BoxSet"]
                };

                $('#SortTitleUpdaterConfigPage').on('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    var page = this;

                    ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders')).then(function (folders) {
                        ApiClient.getPluginConfiguration(SortTitleUpdaterPage.pluginId).then(function (config) {

                            var libraryHtml = '';
                            folders.forEach(function (folder) {
                                var checked = (config.TargetLibraryIds || []).indexOf(folder.ItemId) > -1 ? ' checked' : '';
                                libraryHtml += '<div class="checkboxContainer checkboxContainer-withDescription">' +
                                               '  <label class="emby-checkbox-label">' +
                                               '    <input type="checkbox" is="emby-checkbox" class="chkLibrary" data-id="' + folder.ItemId + '"' + checked + ' />' +
                                               '    <span class="checkboxLabel">' + folder.Name + '</span>' +
                                               '  </label>' +
                                               '</div>';
                            });
                            $('#LibraryList', page).html(libraryHtml);

                            var mediaHtml = '';
                            var savedKinds = config.TargetMediaKinds || SortTitleUpdaterPage.availableKinds;
                            SortTitleUpdaterPage.availableKinds.forEach(function (kind) {
                                var checked = savedKinds.indexOf(kind) > -1 ? ' checked' : '';
                                mediaHtml += '<div class="checkboxContainer checkboxContainer-withDescription">' +
                                             '  <label class="emby-checkbox-label">' +
                                             '    <input type="checkbox" is="emby-checkbox" class="chkMediaKind" data-kind="' + kind + '"' + checked + ' />' +
                                             '    <span class="checkboxLabel">' + kind + '</span>' +
                                             '  </label>' +
                                             '</div>';
                            });
                            $('#MediaKindsList', page).html(mediaHtml);

                            Dashboard.hideLoadingMsg();
                        });
                    });
                });

                $('#SortTitleUpdaterForm').on('submit', function () {
                    Dashboard.showLoadingMsg();
                    var page = this;

                    var targetLibraryIds = [];
                    $('.chkLibrary:checked', page).each(function () {
                        targetLibraryIds.push($(this).attr('data-id'));
                    });

                    var targetMediaKinds = [];
                    $('.chkMediaKind:checked', page).each(function () {
                        targetMediaKinds.push($(this).attr('data-kind'));
                    });

                    ApiClient.getPluginConfiguration(SortTitleUpdaterPage.pluginId).then(function (config) {
                        config.TargetLibraryIds = targetLibraryIds;
                        config.TargetMediaKinds = targetMediaKinds;

                        ApiClient.updatePluginConfiguration(SortTitleUpdaterPage.pluginId, config).then(function (result) {
                            Dashboard.hideLoadingMsg();
                            toast('Settings saved successfully');
                        });
                    });

                    return false;
                });
    </script>
</div>
