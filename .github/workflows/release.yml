name: Build, Package and Publish Release Assets

on:
  release:
    types: [published, created, edited]
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1 

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Plugin.csproj

    - name: Build and Publish Plugin
      run: dotnet publish Plugin.csproj -c Release -o ./publish

    - name: Copy raw DLL for Release Assets
      run: cp ./publish/Jellyfin.Plugin.SortTitleUpdater.dll ./Jellyfin.Plugin.SortTitleUpdater.dll

    - name: Create Zip Archive
      run: |
        VERSION_TAG="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION_TAG" ]; then VERSION_TAG="${{ github.ref_name }}"; fi
        VERSION_CLEAN=$(echo $VERSION_TAG | sed 's/^v//')
        REPO_OWNER="${{ github.repository_owner }}"

        # 1. Dynamically calculate the current timestamp in standard ISO 8601 UTC format
        CURRENT_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        # 2. Generate a valid meta.json file directly inside the publish directory
        cat <<EOF > ./publish/meta.json
        {
          "category": "Library",
          "description": "Encodes media Sort Titles using a strict UTF-16 binary layout via a scheduled library task.",
          "name": "SortTitleUpdater",
          "owner": "$REPO_OWNER",
          "version": "$VERSION_CLEAN",
          "status": "Active",
          "guid": "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d",
          "timestamp": "$CURRENT_TIMESTAMP"
        }
        EOF

        # 3. Copy the icon image into the publish folder if it exists in the repository
        if [ -f "icon.png" ]; then cp icon.png ./publish/icon.png; fi
        
        cd publish
        # Pack the DLL, dynamic meta.json, and the icon asset into the root of the archive
        zip -r ../SortTitleUpdater.zip ./*
        cd ..

    - name: Calculate MD5 Checksum
      id: calc_md5
      run: |
        MD5_HASH=$(md5sum SortTitleUpdater.zip | awk '{ print $1 }')
        echo "Generated MD5: $MD5_HASH"
        echo "md5=$MD5_HASH" >> $GITHUB_OUTPUT

    - name: Dynamically Generate manifest.json
      # Safe environment injection directly into the runner execution context
      env:
        OWNER_NAME: ${{ github.repository_owner }}
        REPO_PATH: ${{ github.repository }}
        CHECKSUM_VAL: ${{ steps.calc_md5.outputs.md5 }}
      run: |
        VERSION_TAG="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION_TAG" ]; then VERSION_TAG="${{ github.ref_name }}"; fi
        
        VERSION_CLEAN=$(echo $VERSION_TAG | sed 's/^v//')
        CHANGELOG="${{ github.event.release.body }}"
        if [ -z "$CHANGELOG" ]; then CHANGELOG="Automated plugin update for version $VERSION_TAG"; fi

        # Construct the final full package download link safely in plain bash
        FINAL_SOURCE_URL="https://github.com/${REPO_PATH}/releases/download/${VERSION_TAG}/SortTitleUpdater_${VERSION_TAG}.zip"

        # Write a strict boilerplate structure completely free of inline bash variables
        cat << 'NO_EOF' > template.json
        [
          {
            "guid": "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d",
            "name": "SortTitleUpdater",
            "category": "Library",
            "description": "Encodes media Sort Titles using a strict UTF-16 binary layout via a scheduled library task.",
            "overview": "Forces multi-language custom binary character sorting for all selected libraries by modifying DB metadata and updating local .nfo assets.",
            "owner": "PLACEHOLDER_OWNER",
            "imageUrl": "https://raw.githubusercontent.com/dhatkovsky/Jellyfin-Sort-Task-Plugin/master/Icon.png",
            "versions": [
              {
                "version": "PLACEHOLDER_VERSION",
                "changelog": "PLACEHOLDER_CHANGELOG",
                "targetAbi": "10.12.0.0",
                "sourceUrl": "PLACEHOLDER_URL",
                "checksum": "PLACEHOLDER_CHECKSUM"
              }
            ]
          }
        ]
        NO_EOF

        # Use native 'jq' to securely inject values into the template without character loss or string corruption
        jq --arg owner "$OWNER_NAME" \
           --arg ver "$VERSION_CLEAN" \
           --arg chg "$CHANGELOG" \
           --arg url "$FINAL_SOURCE_URL" \
           --arg chk "$CHECKSUM_VAL" \
           '.[0].owner = $owner | .[0].versions[0].version = $ver | .[0].versions[0].changelog = $chg | .[0].versions[0].sourceUrl = $url | .[0].versions[0].checksum = $chk' \
           template.json > manifest.json

        # Clean up temporary template file
        rm template.json

    - name: Rename zip to match version tag
      run: |
        VERSION_TAG="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION_TAG" ]; then VERSION_TAG="${{ github.ref_name }}"; fi
        mv SortTitleUpdater.zip SortTitleUpdater_$VERSION_TAG.zip
        
    - name: Publish All Assets to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          Jellyfin.Plugin.SortTitleUpdater.dll
          manifest.json
          SortTitleUpdater_*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
