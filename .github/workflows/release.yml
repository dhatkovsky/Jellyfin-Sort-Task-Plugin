name: Build, Package and Publish Release Assets

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required natively by GitHub to attach files to an active release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Lightweight checkout since we don't need historical branch pushes

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish Plugin
      run: dotnet publish -c Release -o ./publish

    - name: Copy raw DLL for Release Assets
      run: cp ./publish/Jellyfin.Plugin.SortTitleUpdater.dll ./Jellyfin.Plugin.SortTitleUpdater.dll

    - name: Create Zip Archive
      run: |
        cd publish
        # Pack only the compiled dll directly into the root of the zip archive
        zip -j ../SortTitleUpdater.zip Jellyfin.Plugin.SortTitleUpdater.dll
        cd ..

    - name: Calculate MD5 Checksum
      id: calc_md5
      run: |
        # Calculate MD5 hash and save it as an output variable for github actions
        MD5_HASH=$(md5sum SortTitleUpdater.zip | awk '{ print $1 }')
        echo "Generated MD5: $MD5_HASH"
        echo "md5=$MD5_HASH" >> $GITHUB_OUTPUT

    - name: Dynamically Generate manifest.json
      run: |
        # Retrieve the release tag name (e.g., v1.0.0)
        VERSION_TAG="${{ github.event.release.tag_name }}"
        # Strip the leading 'v' if present to comply with Jellyfin's version format (e.g., 1.0.0)
        VERSION_CLEAN=$(echo $VERSION_TAG | sed 's/^v//')
        
        # Dynamically fetch repository and owner information
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        # Construct the direct download link pointing straight to this specific release asset archive
        SOURCE_URL="https://github.com"
        CHECKSUM="${{ steps.calc_md5.outputs.md5 }}"
        CHANGELOG="${{ github.event.release.body }}"
        
        # Set a default changelog fallback if description is empty
        if [ -z "$CHANGELOG" ]; then CHANGELOG="Automated plugin update for version $VERSION_TAG"; fi
        # Escape newlines and double quotes for valid JSON compliance
        CHANGELOG=$(echo "$CHANGELOG" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

        # Generate the dynamic manifest file into the root directory
        cat <<EOF > manifest.json
        [
          {
            "guid": "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d",
            "name": "Sort Title Updater",
            "category": "Library",
            "description": "Encodes media Sort Titles using a strict UTF-16 binary layout via a scheduled library task.",
            "overview": "Forces multi-language custom binary character sorting for all selected libraries by modifying DB metadata and updating local .nfo assets.",
            "owner": "$REPO_OWNER",
            "versions": [
              {
                "version": "$VERSION_CLEAN",
                "changelog": "$CHANGELOG",
                "targetAbi": "10.12.0.0",
                "sourceUrl": "$SOURCE_URL",
                "checksum": "$CHECKSUM"
              }
            ]
          }
        ]
        EOF

    - name: Rename zip to match version tag
      run: mv SortTitleUpdater.zip SortTitleUpdater_${{ github.event.release.tag_name }}.zip

    - name: Publish All Assets to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Jellyfin.Plugin.SortTitleUpdater.dll
          SortTitleUpdater_${{ github.event.release.tag_name }}.zip
          manifest.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Explicitly feed the native high-privilege context token
