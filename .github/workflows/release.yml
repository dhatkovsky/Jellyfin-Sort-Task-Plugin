name: Build, Package and Auto-Update Manifest

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to commit changes to manifest.json and upload assets to the release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches all history for a successful git push operation

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish Plugin
      run: dotnet publish -c Release -o ./publish

    - name: Copy raw DLL for Release Assets
      run: cp ./publish/Jellyfin.Plugin.SortTitleUpdater.dll ./Jellyfin.Plugin.SortTitleUpdater.dll

    - name: Create Zip Archive
      run: |
        cd publish
        # Pack only the compiled dll directly into the root of the zip archive
        zip -j ../SortTitleUpdater.zip Jellyfin.Plugin.SortTitleUpdater.dll
        cd ..

    - name: Calculate MD5 Checksum
      id: calc_md5
      run: |
        # Calculate MD5 hash and save it as an output variable for github actions
        MD5_HASH=$(md5sum SortTitleUpdater.zip | awk '{ print $1 }')
        echo "Generated MD5: $MD5_HASH"
        echo "md5=$MD5_HASH" >> $GITHUB_OUTPUT

    - name: Upload DLL to GitHub Release Assets
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./Jellyfin.Plugin.SortTitleUpdater.dll
        asset_name: Jellyfin.Plugin.SortTitleUpdater.dll
        asset_content_type: application/octet-stream

    - name: Upload Zip to GitHub Release Assets
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./SortTitleUpdater.zip
        asset_name: SortTitleUpdater_${{ github.event.release.target_commitish }}.zip
        asset_content_type: application/zip

    - name: Automatically Update manifest.json
      run: |
        # Retrieve the release tag name (e.g., v1.0.0)
        VERSION_TAG="${{ github.event.release.tag_name }}"
        # Strip the leading 'v' if present to comply with Jellyfin's version format (e.g., 1.0.0)
        VERSION_CLEAN=$(echo $VERSION_TAG | sed 's/^v//')
        
        # Dynamically fetch repository information
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        # Construct the direct download link for the release asset archive
        SOURCE_URL="https://github.com"
        CHECKSUM="${{ steps.calc_md5.outputs.md5 }}"
        CHANGELOG="${{ github.event.release.body }}"
        
        # Set a default changelog fallback if description is empty
        if [ -z "$CHANGELOG" ]; then CHANGELOG="Automated plugin update for version $VERSION_TAG"; fi
        # Escape newlines and double quotes for valid JSON compilation
        CHANGELOG=$(echo "$CHANGELOG" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

        # Generate a clean, updated manifest file
        cat <<EOF > manifest.json
        [
          {
            "guid": "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d",
            "name": "Sort Title Updater",
            "category": "Library",
            "description": "Encodes media Sort Titles using a strict UTF-16 binary layout via a scheduled library task.",
            "overview": "Forces multi-language custom binary character sorting for all selected libraries by modifying DB metadata and updating local .nfo assets.",
            "owner": "$REPO_OWNER",
            "versions": [
              {
                "version": "$VERSION_CLEAN",
                "changelog": "$CHANGELOG",
                "targetAbi": "10.12.0.0",
                "sourceUrl": "$SOURCE_URL",
                "checksum": "$CHECKSUM"
              }
            ]
          }
        ]
        EOF

        # Configure GitHub Actions bot profile for committing
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Stage, commit and push changes back to the target branch (skipping CI to avoid recursion loops)
        git add manifest.json
        git commit -m "chore: automated manifest update for version $VERSION_TAG [skip ci]"
        # Dynamically determines the current default branch name and pushes updates directly
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git push origin HEAD:$CURRENT_BRANCH

